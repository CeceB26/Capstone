<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Password</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{ background: var(--bg); }
    .wrap{ max-width: 520px; margin: 80px auto; padding: 0 16px; }
    .panel{ background: var(--card); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .row{ display:flex; flex-direction:column; gap:6px; margin: 10px 0; }
    input{ padding:10px 12px; border:1px solid var(--line); border-radius:12px; }
    .hint{ color: var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1 style="margin:0 0 8px;">Set Your Password</h1>
      <p class="hint" id="modeLabel">Use this form to set your password.</p>

      <div class="row">
        <label>New password (min 8 chars)</label>
        <input id="p1" type="password" placeholder="••••••••" />
      </div>

      <div class="row">
        <label>Confirm password</label>
        <input id="p2" type="password" placeholder="••••••••" />
      </div>

      <button class="btn" id="setBtn" type="button">Save Password</button>
      <div class="hint" id="status" style="margin-top:10px;"></div>
    </div>
  </div>

  <script src="/Capstone/set-password.js" defer></script>
</body>
</html>
